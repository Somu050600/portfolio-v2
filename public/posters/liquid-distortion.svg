<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/>
      <stop offset="0.46" stop-color="#16132b"/>
      <stop offset="1" stop-color="#08251f"/>
    </linearGradient>
    <radialGradient id="cyan" cx="22%" cy="32%" r="55%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="78%" cy="70%" r="52%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="62%" cy="22%" r="48%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.15" fill="#fff" fill-opacity="0.08"/>
    </pattern>
    <filter id="liquid" x="-10%" y="-15%" width="120%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <g filter="url(#liquid)">
    <rect width="640" height="360" fill="url(#cyan)"/>
    <rect width="640" height="360" fill="url(#violet)"/>
    <rect width="640" height="360" fill="url(#teal)"/>
    <rect width="640" height="360" fill="url(#dots)"/>
    <text x="320" y="186" fill="#eef6ff" font-family="Georgia, serif" font-size="88" font-weight="700" text-anchor="middle">LIQUID</text>
    <text x="320" y="232" fill="#9fb0ca" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" text-anchor="middle">MOVE THROUGH THE FIELD</text>
  </g>
</svg>
